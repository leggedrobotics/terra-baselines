# -----------------------------------------------------------------------------
# M1 v5-main curriculum screen (2026-07-30). Bank: map-curriculum-v5-main;
# materialize with scripts/build_v5m_dataset.py and point DATASET_PATH at the
# resulting curriculum_v5m/ root, DATASET_SIZE at the level size (864).
# max_steps is set on EVERY level because terra/curriculum.py rewrites
# EnvConfig.max_steps_in_episode from this table on both reset and update.
#
# These names preserve the historical M1 map/scheduler treatments. Their
# executable reward is now the agent-neutral relocation-progress reward and
# therefore does not reproduce the historical M1 reward contract.
# -----------------------------------------------------------------------------

curriculum_v5m_a_t0:
