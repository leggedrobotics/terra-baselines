# -----------------------------------------------------------------------------
# P5 accepted-bank screen.
#
# These presets contain no map paths. `--accepted-bank-root` must point at a
# frozen terra_curriculum_loader_bank_v1 index, from which train_mixed.py
# selects one exact MapsBuffer directory per condition. This makes the root a
# required run parameter and prevents an old 12-map bank from being selected by
# an inherited DATASET_PATH.
#
# All six arms share reward, horizon, observations, actions, dynamics and PPO.
# The only G-UNIFORM/G-ADAPTIVE difference is whether the explicit condition
# probability vector moves.
# -----------------------------------------------------------------------------

F-ANCHOR:
  description: Accepted foundation anchors, uniform condition mass, scratch
  accepted_bank_arm: F-ANCHOR
  agent_types: [0]
  action_types: [0]
  relocation_progress_mult: 1.5
  curriculum:
    increase_level_threshold: 1000000000
    decrease_level_threshold: 1000000000
    last_level_type: none
  pooled_sampler:
    enabled: true
    rule: uniform

F-SPECIALIST:
