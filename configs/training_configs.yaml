# -----------------------------------------------------------------------------
# M2 dose-curriculum campaign (CURRICULUM_SPEC_V6.md section 4). Three arms,
# 8,000 updates each, scratch init, E8 template arch, 4 x 1024 x 32.
#
# The map and promotion treatments remain unchanged. All arms now use the same
# agent-neutral relocation-progress reward; historical reward-v1/reward-v2
# return comparisons are not valid for new runs from these presets.
#
# Bank per arm. DATASET_PATH must match the arm; DATASET_SIZE is 864 for both
# banks (terra/maps_buffer.py requires one slot count for every level):
#   m2_wave_long -> terra_data/curriculum_v5m  (M1-C's own materialization)
#   m2_dose      -> terra_data/curriculum_v6m  (dose levels, spec section 3)
#   m2_dose_fast -> terra_data/curriculum_v6m
#
# m2_dose_fast is 2-consecutive-exact ONLY. Spec section 4 also asked for a
# "rolling graded >= 0.8 over the last 3 episodes" disjunct; terra's
# CurriculumConfig carries no graded history (level, consecutive_failures,
# consecutive_successes) so that half is not expressible without new per-env
# state. Descoped on 2026-07-30 (REVIEW_V6 M2-1); prediction 2 is restated to
# the >= 1.5x form because the manipulation is now 2-vs-3 consecutive.
# -----------------------------------------------------------------------------

m2_wave_long:
  description: M2-wave-long - M1-C's wave recipe at 8k updates on curriculum_v5m
  agent_types: [0]
  action_types: [0]
  relocation_progress_mult: 1.5
  curriculum:
    increase_level_threshold: 3
    decrease_level_threshold: 3
    last_level_type: none
  maps:
    - path: train/L0
      max_steps: 450
      rewards_type: DENSE
      apply_trench_rewards: false
    - path: train/L1
      max_steps: 450
      rewards_type: DENSE
      apply_trench_rewards: false
    - path: train/L2
      max_steps: 450
      rewards_type: DENSE
      apply_trench_rewards: false
    - path: train/L3
      max_steps: 450
      rewards_type: DENSE
      apply_trench_rewards: false

